<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Dom Putty Fanpage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #050505;
      color: #f7f4f2;
      font-family: "DM Sans", "Segoe UI", sans-serif;
    }

    h1 {
      display: inline-block;
      margin: 26px 30px;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      animation: idle-bob 3s ease-in-out infinite;
    }

    .walking-area {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      height: 130px;
      overflow: hidden;
      pointer-events: none;
    }

    .bennett {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 110px;
      height: 110px;
      object-fit: contain;
      transform-origin: center bottom;
      animation: walk-across 14s linear infinite, waddle 0.32s ease-in-out infinite alternate;
    }

    @keyframes idle-bob {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes walk-across {
      0%,
      49.9% {
        left: 0;
        transform: scaleX(1);
      }
      50%,
      99.9% {
        left: calc(100% - 110px);
        transform: scaleX(-1);
      }
      100% {
        left: 0;
        transform: scaleX(1);
      }
    }

    @keyframes waddle {
      from {
        translate: 0 0;
        rotate: -4deg;
      }
      to {
        translate: 0 -3px;
        rotate: 4deg;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 {
        animation: none;
      }

      .bennett {
        animation: none;
        left: calc(50% - 55px);
      }
    }
  </style>
</head>
<body>
  <h1>Dom Putty Fanpage</h1>
  <div class="walking-area" aria-hidden="true">
    <img class="bennett" src="bs.png" alt="">
  </div>
</body>
</html>
