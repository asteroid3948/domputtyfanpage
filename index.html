<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Dom Putty Fanpage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #050505;
      color: #f7f4f2;
      font-family: "DM Sans", "Segoe UI", sans-serif;
    }

    h1 {
      position: relative;
      z-index: 1;
      display: inline-block;
      margin: 26px 30px;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      animation: idle-bob 3s ease-in-out infinite;
    }

    .bennett {
      position: fixed;
      z-index: 2;
      top: 0;
      left: 0;
      width: 110px;
      height: 110px;
      object-fit: contain;
      transform-origin: center;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
      will-change: left, top, transform;
    }

    .bennett.is-held { cursor: grabbing; }

    body.screen-shake {
      animation: screen-shake 0.55s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes idle-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes screen-shake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      12%, 36%, 60%, 84% { transform: translate(-7px, 3px) rotate(-0.25deg); }
      24%, 48%, 72%, 96% { transform: translate(7px, -3px) rotate(0.25deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
      body.screen-shake { animation: none; }
    }
  </style>
</head>
<body>
  <h1>Dom Putty Fanpage</h1>
  <img class="bennett" id="bennett" src="bs.png" alt="Bennett Speller. Drag and throw him around the screen." draggable="false">

  <script>
    const bennett = document.getElementById("bennett");
    const size = 110;
    const gravity = 1350;
    const wallBounce = 0.72;
    const floorBounce = 0.68;

    const state = {
      x: 55,
      y: innerHeight - size / 2,
      vx: 190,
      vy: 0,
      angle: 0,
      angularVelocity: 0,
      direction: 1,
      held: false,
      pointerId: null,
      grabX: 0,
      grabY: 0,
      lastPointerX: 0,
      lastPointerY: 0,
      lastMoveTime: 0,
      stepTime: 0,
      recovering: false,
      recoveryStart: 0,
      recoveryFrom: 0,
      recoveryTo: 0
    };

    function drawBennett() {
      bennett.style.left = `${state.x}px`;
      bennett.style.top = `${state.y}px`;
      bennett.style.transform = `translate(-50%, -50%) rotate(${state.angle}rad) scaleX(${state.direction})`;
    }

    function shakeScreen(strength = 1) {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.body.style.setProperty("--shake-strength", strength);
      document.body.classList.remove("screen-shake");
      void document.body.offsetWidth;
      document.body.classList.add("screen-shake");
    }

    bennett.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      state.held = true;
      state.recovering = false;
      state.pointerId = event.pointerId;
      state.grabX = event.clientX - state.x;
      state.grabY = event.clientY - state.y;
      state.lastPointerX = event.clientX;
      state.lastPointerY = event.clientY;
      state.lastMoveTime = performance.now();
      state.vx = 0;
      state.vy = 0;
      bennett.classList.add("is-held");
      bennett.setPointerCapture(event.pointerId);
    });

    bennett.addEventListener("pointermove", (event) => {
      if (!state.held || event.pointerId !== state.pointerId) return;

      const now = performance.now();
      const elapsed = Math.max((now - state.lastMoveTime) / 1000, 0.001);
      const dx = event.clientX - state.lastPointerX;
      const dy = event.clientY - state.lastPointerY;

      state.vx = dx / elapsed;
      state.vy = dy / elapsed;
      state.angularVelocity = (dx - dy * 0.45) * 0.018;
      state.angle += state.angularVelocity;

      state.x = event.clientX - state.grabX;
      state.y = event.clientY - state.grabY;

      if (Math.abs(dx) > 1) state.direction = dx < 0 ? -1 : 1;
      state.lastPointerX = event.clientX;
      state.lastPointerY = event.clientY;
      state.lastMoveTime = now;
      drawBennett();
    });

    function normalizeAngle(angle) {
      while (angle > Math.PI) angle -= Math.PI * 2;
      while (angle < -Math.PI) angle += Math.PI * 2;
      return angle;
    }

    function startRecovery() {
      if (normalizeAngle(state.angle) < 0.05 && normalizeAngle(state.angle) > -0.05) return;
      state.recovering = true;
      state.recoveryStart = performance.now();
      state.recoveryFrom = state.angle;
      let target = Math.round(state.angle / (Math.PI * 2)) * Math.PI * 2;
      state.recoveryTo = target;
    }

    function dropBennett(event) {
      if (!state.held || (event && event.pointerId !== state.pointerId)) return;
      state.held = false;
      state.pointerId = null;
      bennett.classList.remove("is-held");

      // Preserve the release velocity with a slight multiplier for satisfying throws.
      state.vx *= 0.95;
      state.vy *= 0.95;
      state.angularVelocity = normalizeAngle(state.angularVelocity);
      if (Math.abs(state.vx) + Math.abs(state.vy) > 900) shakeScreen(0.7);
      startRecovery();
    }

    bennett.addEventListener("pointerup", dropBennett);
    bennett.addEventListener("pointercancel", dropBennett);

    document.body.addEventListener("animationend", (event) => {
      if (event.animationName === "screen-shake") document.body.classList.remove("screen-shake");
    });

    let previousTime = performance.now();
    function animate(now) {
      const delta = Math.min((now - previousTime) / 1000, 0.032);
      previousTime = now;

      if (!state.held) {
        if (!state.recovering) {
          state.vy += gravity * delta;
          state.x += state.vx * delta;
          state.y += state.vy * delta;
          state.angle += state.angularVelocity * delta * 60;
          state.angularVelocity *= Math.pow(0.985, delta * 60);

          const half = size / 2;
          const floor = innerHeight - half;

          if (state.x + half > innerWidth) {
            state.x = innerWidth - half;
            state.vx = -Math.abs(state.vx) * wallBounce;
            state.angularVelocity += state.vy * 0.002;
            if (Math.abs(state.vx) > 180) shakeScreen(0.35);
          } else if (state.x - half < 0) {
            state.x = half;
            state.vx = Math.abs(state.vx) * wallBounce;
            state.angularVelocity -= state.vy * 0.002;
            if (Math.abs(state.vx) > 180) shakeScreen(0.35);
          }

          if (state.y + half > innerHeight) {
            state.y = floor;
            if (Math.abs(state.vy) > 170) {
              state.vy = -Math.abs(state.vy) * floorBounce;
              state.vx *= 0.88;
              state.angularVelocity += state.vx * 0.0008;
              shakeScreen(Math.min(Math.abs(state.vy) / 900, 1));
            } else {
              state.vy = 0;
              state.vx *= 0.94;
            }

            if (Math.abs(state.vx) < 18) state.vx = 0;
            if (Math.abs(state.vy) < 28) {
              state.vy = 0;
              startRecovery();
            }
          }

          if (state.y - half < 0) {
            state.y = half;
            state.vy = Math.abs(state.vy) * wallBounce;
          }
        } else {
          state.vy += gravity * delta;
          state.x += state.vx * delta;
          state.y += state.vy * delta;

          const floor = innerHeight - size / 2;
          if (state.y > floor) {
            state.y = floor;
            state.vy = Math.abs(state.vy) > 120 ? -Math.abs(state.vy) * 0.55 : 0;
            state.vx *= 0.9;
          }

          const progress = Math.min((now - state.recoveryStart) / 650, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          state.angle = state.recoveryFrom + (state.recoveryTo - state.recoveryFrom) * eased;
          if (progress === 1) {
            state.recovering = false;
            state.angle = 0;
            state.angularVelocity = 0;
          }
        }
      }

      drawBennett();
      requestAnimationFrame(animate);
    }

    function keepBennettOnScreen() {
      const half = size / 2;
      state.x = Math.max(half, Math.min(innerWidth - half, state.x));
      state.y = Math.max(half, Math.min(innerHeight - half, state.y));
      drawBennett();
    }

    addEventListener("resize", keepBennettOnScreen);
    drawBennett();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
