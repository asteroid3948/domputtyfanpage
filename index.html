<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101513"><title>Dom Putty Fanpage — Burger Shop</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#101513;color:#f7f8f6;font-family:"DM Sans","Segoe UI",sans-serif;user-select:none}.topbar{position:fixed;z-index:5;inset:0 0 auto;height:112px;padding:18px 22px;border-bottom:1px solid #ffffff12;background:#171d1a}.brand{position:absolute;top:18px;left:22px;margin:0;font-size:clamp(1.05rem,2.8vw,1.65rem);letter-spacing:-.04em}.top-actions{position:absolute;top:18px;right:22px;display:flex;align-items:center;gap:8px}.coins{padding:7px 9px;border-radius:8px;color:#bfc8c2;font-size:.9rem}.coins strong{margin-left:5px;color:#7be397;font-size:1.12rem}.buy-button{border:1px solid #78cd8e;border-radius:9px;padding:8px 10px;background:transparent;color:#bff1cc;font:inherit;font-weight:800;cursor:pointer}.buy-button:hover:not(:disabled){background:#78cd8e18}.buy-button:disabled{cursor:not-allowed;opacity:.42}#stage{position:fixed;z-index:1;inset:112px 0 0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#26312a,#111714 68%,#0c100e)}#stage:after{position:absolute;z-index:1;inset:auto 0 0;height:15px;background:#596359;content:"";pointer-events:none}.character,.physics-item{position:absolute;z-index:2;display:block;object-fit:contain;touch-action:none;user-select:none;-webkit-user-drag:none;will-change:left,top,transform}.character{z-index:3;width:120px;height:120px;cursor:grab}.physics-item{z-index:4;cursor:grab}.held{cursor:grabbing!important}.burger{width:56px;height:56px}.goop{width:30px;height:30px}.slime{width:100px;height:100px;cursor:pointer}.tom{width:92px;height:92px}.snickers{width:76px;height:44px}.money{width:42px;height:30px}.machine{z-index:3;width:90px;height:90px;cursor:default}.collector-hitbox{position:absolute;z-index:6;width:68px;height:88px;opacity:0;pointer-events:none}.hand-stack{position:absolute;z-index:5;width:52px;height:48px;pointer-events:none}.hand-stack img{position:absolute;width:18px;height:18px}.stack-count{position:absolute;right:-5px;top:-8px;background:#7be397;color:#102017;border-radius:10px;padding:1px 5px;font-size:11px;font-weight:bold}.shop-popover,.keypad{position:fixed;z-index:10;display:none;width:min(330px,calc(100vw - 32px));max-height:76vh;overflow:auto;padding:16px;border:1px solid #ffffff40;border-radius:14px;background:#1c2420;box-shadow:0 18px 50px #0009}.shop-popover.open,.keypad.open{display:block;animation:pop .18s ease-out}.shop-popover h2,.keypad h2{margin:0 0 8px;font-size:1.1rem}.shop-popover p{margin:0 0 12px;color:#bfc8c2;font-size:.9rem}.shop-popover .buy-button{width:100%;margin:5px 0}.shop-status{margin:0 0 7px;color:#a9d8b4;font-size:.78rem}.keypad-display{padding:9px;margin:8px 0 12px;border-radius:8px;background:#101513;text-align:center;letter-spacing:.35em;min-height:38px}.key-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.key-grid button{padding:11px;border:1px solid #78cd8e66;border-radius:8px;background:#28332c;color:white;font:inherit;font-weight:800;cursor:pointer}.conversion{position:fixed;z-index:6;display:none;width:92px;height:22px;overflow:hidden;border:1px solid #ffffff55;border-radius:12px;background:#d7ddd7;pointer-events:none}.conversion.visible{display:block}.progress-fill{width:0;height:100%;background:#78cd8e}.progress-percent{position:absolute;inset:0;display:grid;place-items:center;color:#15241a;font-size:.72rem;font-weight:800}.tutorial{position:fixed;z-index:12;left:50%;top:126px;transform:translateX(-50%);width:min(420px,calc(100vw - 24px));padding:14px 16px;border:1px solid #78cd8e88;border-radius:14px;background:#1c2420;box-shadow:0 12px 40px #0009}.tutorial strong{display:block;margin-bottom:5px;color:#9be6ad}.tutorial p{margin:0;color:#e3e9e4;font-size:.9rem;line-height:1.45}.tutorial-actions{display:flex;justify-content:space-between;margin-top:10px;color:#aebbb2;font-size:.76rem}.tutorial button{border:0;background:none;color:#bfc8c2;font:inherit;text-decoration:underline;cursor:pointer}.machine-label{position:absolute;z-index:5;pointer-events:none;text-align:center;color:#fff;font-size:11px;font-weight:800;text-shadow:0 2px 4px #000}.atm-decoration{position:absolute;z-index:2;left:18px;bottom:24px;width:78px;height:90px;object-fit:contain;pointer-events:none}@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}@media(max-width:600px){.topbar{height:118px}.brand{top:12px;left:12px}.top-actions{top:50px;right:6px;gap:3px}.top-actions .buy-button{padding:6px;font-size:.72rem}.coins{padding:4px;font-size:.76rem}#stage{inset-block-start:118px}.character{width:108px;height:108px}.tutorial{top:124px}}
</style></head><body>
<header class="topbar"><h1 class="brand">Dom Putty Fanpage</h1><div class="top-actions"><div class="coins" id="coin-target">Coins <strong id="coins">10</strong></div><button class="buy-button" id="buy-burger">Buy Burger · 8</button><button class="buy-button" id="shop-button">Shop</button></div></header><main id="stage" aria-label="Play area"><img class="character" id="bennett" src="bs.png" alt="Bennett. Click to make goop." draggable="false"></main><div class="conversion" id="conversion"><div class="progress-fill" id="progress-fill"></div><span class="progress-percent" id="progress-percent">0%</span></div><div class="shop-popover" id="shop"></div><aside class="keypad" id="keypad"><h2>Admin passcode</h2><div class="keypad-display" id="key-display">Enter code</div><div class="key-grid" id="key-grid"></div><button class="buy-button" id="key-clear">Clear</button><button class="buy-button" id="key-close">Cancel</button></aside><aside class="tutorial" id="tutorial"><strong id="tutorial-title"></strong><p id="tutorial-text"></p><div class="tutorial-actions"><span id="tutorial-step"></span><button id="skip-tutorial">Skip tutorial</button></div></aside>
<script>
const $=id=>document.getElementById(id),stage=$('stage'),ben=$('bennett'),shop=$('shop'),tutorial=$('tutorial'),bodies=[];let coins=10,slime=null,tom=null,collector=null,goopFed=0,queue=0,converting=false,conversionAt=0,superLevel=0,burgerLevel=0,snickersLevel=0,collectorLevel=0,atm=false,burgerClock=0,tut=0,keyCount=0,keyCode='',adminUnlocked=false;const cost={collector:10,super:35,burgermatic:90,snickermatic:140,atm:25};
const steps=[['Buy a burger','Click “Buy Burger · 8” to buy a burger.'],['Feed Bennett','Drag the burger onto Bennett to turn it into a Snickers.'],['Give Tom the Snickers','Drag the Snickers onto Tom to get money.'],['Deposit the money','Drag a dollar note onto Bennett to add it to your balance.'],['Make goop','Click Bennett to make goop.'],['Open the shop','Click Shop (or click the slime) to open the shop. That’s the end—buying upgrades is optional.']];function tutorialShow(){if(tut>=steps.length){tutorial.remove();return}$('tutorial-title').textContent=steps[tut][0];$('tutorial-text').textContent=steps[tut][1];$('tutorial-step').textContent=`Step ${tut+1} of ${steps.length}`}function advance(n){if(tut===n){tut++;tutorialShow()}}tutorialShow();$('skip-tutorial').onclick=()=>tutorial.remove();
function body(el,x,y,w,h,kind){return{element:el,x,y,width:w,height:h,vx:0,vy:0,angle:0,kind,held:false,removed:false}}const bennett=body(ben,0,0,116,116,'bennett');bodies.push(bennett);function pos(b){b.element.style.left=b.x+'px';b.element.style.top=b.y+'px';b.element.style.transform=`translate(-50%,-50%) rotate(${b.angle}rad)`}function placeBen(){bennett.x=stage.clientWidth/2;bennett.y=stage.clientHeight-70;pos(bennett)}
function spawn(kind,src,x,y,vx=0,vy=0,w=48,h=40,alt=''){const el=document.createElement('img');el.className=`physics-item ${kind}`;el.src=src;el.alt=alt;el.draggable=false;stage.append(el);const b=body(el,x,y,w,h,kind);b.vx=vx;b.vy=vy;bodies.push(b);drag(b);pos(b);return b}function drag(b){b.element.addEventListener('pointerdown',e=>{if(b.removed||['collector','machine'].includes(b.kind))return;e.preventDefault();b.held=true;b.pid=e.pointerId;b.element.classList.add('held');const r=stage.getBoundingClientRect();b.ox=e.clientX-r.left-b.x;b.oy=e.clientY-r.top-b.y;b.element.setPointerCapture(e.pointerId)});b.element.addEventListener('pointermove',e=>{if(!b.held||b.pid!==e.pointerId)return;const r=stage.getBoundingClientRect();b.x=e.clientX-r.left-b.ox;b.y=e.clientY-r.top-b.oy;pos(b)});const up=e=>{if(!b.held||b.pid!==e.pointerId)return;b.held=false;b.element.classList.remove('held');const over=el=>{const a=b.element.getBoundingClientRect(),r=el.getBoundingClientRect();return a.left+a.width/2>=r.left&&a.left+a.width/2<=r.right&&a.top+a.height/2>=r.top&&a.top+a.height/2<=r.bottom};if(b.kind==='burger'&&over(ben))eatBurger(b);else if(b.kind==='snickers'&&tom&&over(tom.element))giveTom(b);else if(b.kind==='money'&&(over(ben)||over($('coin-target'))))deposit(b,over(ben));else if(b.kind==='goop'&&slime&&over(slime.element))feed(b)};b.element.addEventListener('pointerup',up);b.element.addEventListener('pointercancel',up)}drag(bennett);
function spawnTom(){if(tom&&!tom.removed)return;tom=spawn('tom','tom.jpeg',Math.max(60,stage.clientWidth*.22),stage.clientHeight-65,0,0,92,92,'Tom')}function ensureSlime(){if(slime&&!slime.removed)return;slime=spawn('slime','slime.png',Math.min(stage.clientWidth-65,bennett.x+150),Math.max(100,bennett.y-75),0,0,100,100,'Slime. Click to open shop');slime.element.addEventListener('click',()=>openShop(slime.element))}
function refreshShop(){const item=(id,title,price,desc,owned=false)=>`<button class="buy-button" data-buy="${id}" ${owned||coins<price?'disabled':''}>${owned?'Owned ✓':`${title} · ${price} Coins`}</button><div class="shop-status">${desc}</div>`;shop.innerHTML=`<h2>Shop & Upgrades</h2><p>Machines appear in the play area when purchased. Upgrade them for faster production.</p>${item('collector','Goop Collector',10+collectorLevel*15,`Collects goop; level ${collectorLevel}. Next levels increase speed and capacity.`)}${item('super','Super Burger',35+superLevel*30,'Spawns free burgers automatically every 12 seconds.')}${item('burgermatic','Burgermatic 1000',90+burgerLevel*60,'Automatically feeds nearby burgers to Bennett.')}${item('snickermatic','Snickermatic 1000',140+snickersLevel*90,'Automatically delivers Snickers to Tom.')}${item('atm','ATM',25,'Automatically deposits money notes.',atm)}${adminUnlocked?'<button class="buy-button" id="admin-give">Admin: Give 10 Coins</button><div class="shop-status">Adds 10 coins each click.</div>':''}`;shop.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>buy(x.dataset.buy));if(adminUnlocked)$('admin-give').onclick=()=>{coins+=10;updateCoins()}}function updateCoins(){$('coins').textContent=coins;$('buy-burger').disabled=coins<8;$('buy-burger').textContent=coins>=8?'Buy Burger · 8':'Need 8 Coins';refreshShop()}
function openShop(anchor){const r=anchor?.getBoundingClientRect(),w=Math.min(330,innerWidth-32);shop.style.left=Math.max(16,Math.min(innerWidth-w-16,r?r.left+r.width/2-w/2:innerWidth-w-16))+'px';shop.style.top=Math.max(120,Math.min(innerHeight-320,r?r.top-240:130))+'px';shop.classList.add('open');refreshShop();advance(5)}$('shop-button').onclick=()=>openShop(null);shop.addEventListener('pointerdown',e=>e.stopPropagation());addEventListener('pointerdown',e=>{if(shop.classList.contains('open')&&!shop.contains(e.target)&&e.target.id!=='shop-button')shop.classList.remove('open')});
function machine(src,label){const b=spawn('machine',src,Math.max(55,Math.min(stage.clientWidth-55,80+bodies.filter(x=>x.kind==='machine').length*100)),stage.clientHeight-66,0,0,86,86,label);b.kind='machine';const tag=document.createElement('div');tag.className='machine-label';tag.textContent=label;stage.append(tag);b.tag=tag;return b}function buy(id){if(id==='collector'){const price=10+collectorLevel*15;if(coins<price)return;coins-=price;collectorLevel++;if(!collector){collector=machine('colector.png','Goop Collector');collector.kind='collector';collector.load=[];collector.capacity=10;collector.speed=220;collector.hitbox=document.createElement('div');collector.hitbox.className='collector-hitbox';stage.append(collector.hitbox);collector.stack=document.createElement('div');collector.stack.className='hand-stack';stage.append(collector.stack)}else{collector.capacity+=2;collector.speed+=35}}if(id==='super'){const price=35+superLevel*30;if(coins<price)return;coins-=price;if(!superLevel)machine('sp.png','Super Burger');superLevel++}if(id==='burgermatic'){const price=90+burgerLevel*60;if(coins<price)return;coins-=price;if(!burgerLevel)machine('bm.png','Burgermatic 1000');burgerLevel++}if(id==='snickermatic'){const price=140+snickersLevel*90;if(coins<price)return;coins-=price;if(!snickersLevel)machine('sm.png','Snickermatic 1000');snickersLevel++}if(id==='atm'){if(atm||coins<25)return;coins-=25;atm=true;const el=document.createElement('img');el.src='atm.png';el.alt='ATM';el.className='atm-decoration';stage.append(el)}updateCoins()}
function spawnGoop(){const a=Math.random()*Math.PI*2,s=300;spawn('goop','goop.png',bennett.x+Math.cos(a)*35,bennett.y+Math.sin(a)*35,Math.cos(a)*s,Math.sin(a)*s-80,30,30,'Goop');ensureSlime();advance(4)}ben.addEventListener('click',()=>{if(!bennett.moved)spawnGoop()});function dispense(){if(coins<8)return;coins-=8;updateCoins();spawn('burger','burger.png',stage.clientWidth/2,50,0,60,54,54,'Burger');advance(0)}$('buy-burger').onclick=dispense;
function eatBurger(b){remove(b);queue++;advance(1);if(!converting){converting=true;conversionAt=performance.now();$('conversion').classList.add('visible')}}function finish(){converting=false;$('conversion').classList.remove('visible');spawn('snickers','bar.png',bennett.x-30,bennett.y-40,-120,-280,72,42,'Snickers. Drag to Tom');spawnTom();if(queue){converting=true;conversionAt=performance.now()}}function remove(b){if(b.removed)return;b.removed=true;b.element.remove();b.tag?.remove()}function money(x,y,value=5){const b=spawn('money','dal.png',x,y,(Math.random()-.5)*140,-260,40,28,'Dollar note. Drag onto Bennett');b.value=value;return b}function giveTom(b){remove(b);money(tom.x-20,tom.y-25,5);money(tom.x+20,tom.y-30,5);advance(2)}function deposit(b,onBen){remove(b);coins+=b.value||1;updateCoins();if(onBen)advance(3)}function feed(b){remove(b);goopFed++;if(goopFed>=5){goopFed-=5;money(slime.x,slime.y-20,1)}}
function collectorThink(dt){if(!collector)return;ensureSlime();const gos=bodies.filter(b=>b.kind==='goop'&&!b.removed&&!b.held),returning=collector.load.length>=collector.capacity||!gos.length,target=returning?slime:gos[0];if(!target)return;const tx=target.x,ty=returning?stage.clientHeight-60:target.y,dx=tx-collector.x,dy=ty-collector.y,d=Math.hypot(dx,dy),step=Math.min(d,collector.speed*dt);if(d>2){collector.x+=dx/d*step;collector.y+=dy/d*step}pos(collector);collector.hitbox.style.left=(collector.x-34)+'px';collector.hitbox.style.top=(collector.y-54)+'px';if(!returning&&Math.hypot(collector.x-target.x,collector.y-target.y)<44){remove(target);collector.load.push(target)}else if(returning&&collector.load.length&&Math.hypot(collector.x-slime.x,collector.y-ty)<85){const n=collector.load.length;collector.load.length=0;for(let i=0;i<n;i++)feedGoopCount()}}function feedGoopCount(){goopFed++;if(goopFed>=5){goopFed-=5;money(slime.x,slime.y-20,1)}}
function runMachines(dt){if(superLevel){burgerClock+=dt;if(burgerClock>=Math.max(3,12-(superLevel-1)*2)){burgerClock=0;spawn('burger','burger.png',Math.random()*stage.clientWidth,50,0,40,54,54,'Auto burger')}}for(const b of [...bodies]){if(b.removed||b.held)continue;if(b.kind==='burger'&&burgerLevel&&Math.hypot(b.x-bennett.x,b.y-bennett.y)<150)eatBurger(b);if(b.kind==='snickers'&&snickersLevel&&tom&&Math.hypot(b.x-tom.x,b.y-tom.y)<150)giveTom(b)}if(atm)for(const b of bodies)if(b.kind==='money'&&!b.removed)deposit(b,false)}
function tick(now){const dt=Math.min((now-(tick.last||now))/1000,.032);tick.last=now;for(const b of bodies){if(b.removed||b.held||b.kind==='machine'||b.kind==='collector')continue;b.vy+=1250*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy*=.995;const hw=b.width/2,hh=b.height/2;b.x=Math.max(hw,Math.min(stage.clientWidth-hw,b.x));if(b.y>stage.clientHeight-hh-12){b.y=stage.clientHeight-hh-12;b.vy=-Math.abs(b.vy)*.55;b.vx*=.9}pos(b)}collectorThink(dt);runMachines(dt);if(converting){const p=Math.min(1,(now-conversionAt)/2600),n=Math.floor(p*100);$('progress-fill').style.width=n+'%';$('progress-percent').textContent=n+'%';if(p>=1)finish()}for(const b of bodies)if(b.tag){b.tag.style.left=(b.x-38)+'px';b.tag.style.top=(b.y+40)+'px';b.tag.style.width='76px'}requestAnimationFrame(tick)}
// Press 8 three times to show the keypad, then enter 333. The unlocked state is kept by refreshShop.
const grid=$('key-grid');for(let n=1;n<=9;n++){const k=document.createElement('button');k.textContent=n;k.onclick=()=>enterCode(String(n));grid.append(k)}function enterCode(n){if(keyCode.length>=3)return;keyCode+=n;$('key-display').textContent='•'.repeat(keyCode.length);if(keyCode.length===3){if(keyCode==='333'){adminUnlocked=true;$('keypad').classList.remove('open');openShop(null)}else{$('key-display').textContent='Wrong code';setTimeout(()=>{keyCode='';$('key-display').textContent='Enter code'},800)}}}$('key-clear').onclick=()=>{keyCode='';$('key-display').textContent='Enter code'};$('key-close').onclick=()=>{$('keypad').classList.remove('open');keyCode=''};addEventListener('keydown',e=>{if(e.key==='8'){keyCount++;if(keyCount===3){keyCount=0;keyCode='';$('key-display').textContent='Enter code';$('keypad').classList.add('open')}}else if(!e.repeat)keyCount=0});
addEventListener('resize',()=>{for(const b of bodies){b.x=Math.max(b.width/2,Math.min(stage.clientWidth-b.width/2,b.x));pos(b)}});placeBen();spawnTom();updateCoins();requestAnimationFrame(tick);
</script></body></html>
