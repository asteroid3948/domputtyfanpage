<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101513">
  <title>Dom Putty Fanpage — Burger Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #101513;
      color: #f7f8f6;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      user-select: none;
    }
    button { font: inherit; }

    .topbar {
      position: fixed;
      z-index: 5;
      inset: 0 0 auto;
      height: 112px;
      padding: 18px 22px;
      border-bottom: 1px solid #ffffff12;
      background: #171d1a;
    }
    .brand {
      position: absolute;
      top: 18px;
      left: 22px;
      margin: 0;
      font-size: clamp(1.05rem, 2.8vw, 1.65rem);
      letter-spacing: -.04em;
    }

    .top-actions {
      position: absolute;
      top: 18px;
      right: 22px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .coins { color: #bfc8c2; font-size: .9rem; }
    .coins strong { display: inline-block; margin-left: 5px; color: #7be397; font-size: 1.12rem; }
    .buy-button {
      border: 1px solid #78cd8e;
      border-radius: 9px;
      padding: 9px 12px;
      background: transparent;
      color: #bff1cc;
      font-weight: 800;
      cursor: pointer;
    }
    .buy-button:hover:not(:disabled) { background: #78cd8e18; }
    .buy-button:disabled { cursor: not-allowed; opacity: .42; }

    .tube {
      position: absolute;
      z-index: 7;
      top: -18px;
      left: 50%;
      width: 22px;
      height: 94px;
      transform: translateX(-50%);
      border: 2px solid #7d8981;
      border-radius: 0 0 11px 11px;
      background: linear-gradient(90deg, #69766e, #b2bdb5 48%, #69766e);
    }
    .tube::after {
      position: absolute;
      bottom: -7px;
      left: 50%;
      width: 34px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 0 0 6px 6px;
      background: #69766e;
      content: "";
    }

    #stage {
      position: fixed;
      z-index: 1;
      inset: 112px 0 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, #26312a, #111714 68%, #0c100e);
    }
    #stage::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 15px;
      background: #596359;
      content: "";
    }
    .character, .dropped-burger {
      position: absolute;
      z-index: 2;
      width: 116px;
      height: 116px;
      object-fit: contain;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
      will-change: left, top, transform;
    }
    .character { width: 132px; height: 132px; z-index: 3; }
    .character.held, .dropped-burger.held { cursor: grabbing; }
    .dropped-burger { z-index: 4; }
    .dropped-burger.eating { pointer-events: none; animation: burger-eaten .48s ease-in forwards; }
    .character.munch { animation: munch .56s ease-in-out; }
    .status {
      position: fixed;
      z-index: 4;
      right: 12px;
      bottom: 20px;
      left: 12px;
      margin: 0;
      color: #bdc7c0;
      font-size: .82rem;
      text-align: center;
      pointer-events: none;
    }
    body.screen-shake { animation: shake .38s linear; }

    @keyframes munch {
      0%, 100% { scale: 1; }
      22% { scale: 1.12 .82; }
      48% { scale: .9 1.12; }
      72% { scale: 1.08 .9; }
    }
    @keyframes burger-eaten {
      0% { opacity: 1; scale: 1; }
      55% { opacity: 1; scale: .8; }
      100% { opacity: 0; scale: .08; translate: 0 24px; }
    }
    @keyframes shake {
      0%, 100% { translate: 0 0; }
      20%, 60% { translate: -5px 2px; }
      40%, 80% { translate: 5px -2px; }
    }
    @media (max-width: 600px) {
      .topbar { height: 118px; }
      .brand { top: 12px; left: 12px; }
      .top-actions { top: 50px; right: 12px; gap: 9px; }
      .tube { top: -18px; width: 18px; height: 82px; }
      #stage { inset-block-start: 118px; }
      .character { width: 112px; height: 112px; }
      .dropped-burger { width: 94px; height: 94px; }
    }
    @media (prefers-reduced-motion: reduce) {
      body.screen-shake { animation: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Dom Putty Fanpage</h1>
    <div class="tube" aria-label="Burger dispenser tube"></div>
    <div class="top-actions">
      <div class="coins">Coins <strong id="coins">10</strong></div>
      <button class="buy-button" id="buy-button" type="button">Buy Burger · 8</button>
    </div>
  </header>

  <main id="stage" aria-label="Burger play area">
    <img class="character" id="bennett" src="bs.png" alt="Bennett Speller" draggable="false">
  </main>
  <p class="status" id="status" role="status" aria-live="polite">Drag the burger to Bennett to feed him.</p>

  <script>
    const stage = document.getElementById("stage");
    const bennett = document.getElementById("bennett");
    const buyButton = document.getElementById("buy-button");
    const coinsDisplay = document.getElementById("coins");
    const status = document.getElementById("status");
    const burgerSize = 100;
    const bennettSize = 116;
    const gravity = 1250;
    const floorBounce = 0.62;
    const wallBounce = 0.72;
    let coins = 10;

    function stageBounds() {
      return { width: stage.clientWidth, height: stage.clientHeight };
    }

    function makeBody(element, x, y, width, height, isBennett = false) {
      return {
        element, x, y, vx: 0, vy: 0, angle: 0, spin: 0,
        width, height, isBennett, held: false, pointerId: null,
        grabX: 0, grabY: 0, lastX: 0, lastY: 0, lastTime: 0, removed: false
      };
    }

    const bodies = [];
    const benBody = makeBody(bennett, 0, 0, bennettSize, bennettSize, true);
    bodies.push(benBody);

    function setPosition(body) {
      body.element.style.left = `${body.x}px`;
      body.element.style.top = `${body.y}px`;
      body.element.style.transform = `translate(-50%, -50%) rotate(${body.angle}rad)`;
    }

    function placeBennett() {
      const bounds = stageBounds();
      benBody.x = bounds.width * 0.5;
      benBody.y = bounds.height - bennettSize / 2 - 12;
      setPosition(benBody);
    }

    function updateCoins() {
      coinsDisplay.textContent = String(coins);
      buyButton.disabled = coins < 8;
      buyButton.textContent = coins >= 8 ? "Buy Burger · 8" : "Need 8 Coins";
    }

    function playShake() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.body.classList.remove("screen-shake");
      void document.body.offsetWidth;
      document.body.classList.add("screen-shake");
    }

    function dispenseBurger() {
      if (coins < 8) {
        status.textContent = "You need 8 coins for a burger.";
        return;
      }
      coins -= 8;
      updateCoins();

      const burger = document.createElement("img");
      burger.className = "dropped-burger";
      burger.src = "burger.png";
      burger.alt = "Burger";
      burger.draggable = false;
      stage.append(burger);

      const bounds = stageBounds();
      const tube = document.querySelector(".tube").getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      const body = makeBody(
        burger,
        tube.left + tube.width / 2 - stageRect.left,
        Math.max(burgerSize / 2 + 8, tube.bottom - stageRect.top + burgerSize / 2),
        burgerSize,
        burgerSize
      );
      body.vy = 45;
      bodies.push(body);
      setPosition(body);
      status.textContent = "Burger dispensed. Drag it to Bennett.";
    }

    buyButton.addEventListener("click", dispenseBurger);

    function beginDrag(body, event) {
      if (body.removed) return;
      event.preventDefault();
      body.held = true;
      body.pointerId = event.pointerId;
      const rect = stage.getBoundingClientRect();
      const px = event.clientX - rect.left;
      const py = event.clientY - rect.top;
      body.grabX = px - body.x;
      body.grabY = py - body.y;
      body.lastX = px;
      body.lastY = py;
      body.lastTime = performance.now();
      body.vx = 0;
      body.vy = 0;
      body.element.classList.add("held");
      body.element.setPointerCapture(event.pointerId);
    }

    function moveDrag(body, event) {
      if (!body.held || event.pointerId !== body.pointerId) return;
      const now = performance.now();
      const rect = stage.getBoundingClientRect();
      const px = event.clientX - rect.left;
      const py = event.clientY - rect.top;
      const dt = Math.max((now - body.lastTime) / 1000, 0.008);
      const dx = px - body.lastX;
      const dy = py - body.lastY;
      body.vx = dx / dt;
      body.vy = dy / dt;
      body.spin = (dx - dy) * 0.008;
      body.angle += body.spin;
      body.x = px - body.grabX;
      body.y = py - body.grabY;
      body.lastX = px;
      body.lastY = py;
      body.lastTime = now;
      setPosition(body);
      feedCollisionCheck();
    }

    function endDrag(body, event) {
      if (!body.held || (event && event.pointerId !== body.pointerId)) return;
      body.held = false;
      body.pointerId = null;
      body.element.classList.remove("held");
      body.vx = Math.max(-1900, Math.min(1900, body.vx));
      body.vy = Math.max(-1900, Math.min(1900, body.vy));
      feedCollisionCheck();
    }

    function attachDrag(body) {
      body.element.addEventListener("pointerdown", (event) => beginDrag(body, event));
      body.element.addEventListener("pointermove", (event) => moveDrag(body, event));
      body.element.addEventListener("pointerup", (event) => endDrag(body, event));
      body.element.addEventListener("pointercancel", (event) => endDrag(body, event));
    }

    function feedCollisionCheck() {
      const benRadius = bennettSize * 0.34;
      for (const body of bodies) {
        if (body.isBennett || body.removed || body.held) continue;
        const burgerRadius = body.width * 0.34;
        const dx = body.x - benBody.x;
        const dy = body.y - (benBody.y - 5);
        if (Math.hypot(dx, dy) < benRadius + burgerRadius) eatBurger(body);
      }
    }

    function eatBurger(body) {
      if (body.removed) return;
      body.removed = true;
      body.element.classList.add("eating");
      bennett.classList.remove("munch");
      void bennett.offsetWidth;
      bennett.classList.add("munch");
      status.textContent = "Bennett ate the burger!";
      playShake();
      setTimeout(() => body.element.remove(), 500);
      setTimeout(() => bennett.classList.remove("munch"), 600);
    }

    attachDrag(benBody);

    let burgerPointerListenerReady = false;
    function attachBurgerWhenCreated(burger, body) {
      attachDrag(body);
    }

    const originalAppend = stage.append.bind(stage);
    stage.append = function(...nodes) {
      originalAppend(...nodes);
      for (const node of nodes) {
        if (node.classList?.contains("dropped-burger")) {
          const body = bodies.find((item) => item.element === node);
          if (body) attachBurgerWhenCreated(node, body);
        }
      }
    };

    let previous = performance.now();
    function step(now) {
      const dt = Math.min((now - previous) / 1000, 0.032);
      previous = now;
      const bounds = stageBounds();
      const floorY = bounds.height - 12;

      for (const body of bodies) {
        if (body.removed || body.held) continue;
        const halfW = body.width / 2;
        const halfH = body.height / 2;
        body.vy += gravity * dt;
        body.x += body.vx * dt;
        body.y += body.vy * dt;
        body.angle += body.spin * dt * 30;
        body.spin *= Math.pow(0.985, dt * 60);

        if (body.x < halfW) {
          body.x = halfW;
          body.vx = Math.abs(body.vx) * wallBounce;
        } else if (body.x > bounds.width - halfW) {
          body.x = bounds.width - halfW;
          body.vx = -Math.abs(body.vx) * wallBounce;
        }
        if (body.y < halfH) {
          body.y = halfH;
          body.vy = Math.abs(body.vy) * wallBounce;
        } else if (body.y > floorY - halfH) {
          body.y = floorY - halfH;
          if (Math.abs(body.vy) > 105) {
            body.vy = -Math.abs(body.vy) * floorBounce;
            body.vx *= 0.88;
          } else {
            body.vy = 0;
            body.vx *= body.isBennett ? 0.9 : 0.94;
            if (Math.abs(body.vx) < 14) body.vx = 0;
          }
          if (body.isBennett && Math.abs(body.vy) < 1 && Math.abs(body.angle) > 0.035) {
            body.angle *= Math.max(0, 1 - dt * 2.4);
            if (Math.abs(body.angle) < 0.04) body.angle = 0;
          }
        }
        setPosition(body);
      }
      feedCollisionCheck();
      requestAnimationFrame(step);
    }

    document.body.addEventListener("animationend", (event) => {
      if (event.animationName === "shake") document.body.classList.remove("screen-shake");
    });
    addEventListener("resize", () => {
      const bounds = stageBounds();
      for (const body of bodies) {
        body.x = Math.max(body.width / 2, Math.min(bounds.width - body.width / 2, body.x));
        body.y = Math.min(bounds.height - body.height / 2, body.y);
        setPosition(body);
      }
    });

    placeBennett();
    updateCoins();
    requestAnimationFrame(step);
  </script>
</body>
</html>
