ute;z-index:5;color:#dce7df;font-size:11px;font-weight:800;text-shadow:0 2px 4px #000;text-align:center;pointer-events:none}.atm-decoration{position:absolute;z-index:2;left:18px;bottom:24px;width:78px;height:90px;object-fit:contain;pointer-events:none}@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes munch{0%,100%{scale:1}22%{scale:1.1 .86}48%{scale:.92 1.1}72%{scale:1.06 .92}}@media(max-width:600px){.topbar{height:118px}.brand{top:12px;left:12px}.top-actions{top:50px;right:8px;gap:4px}.top-actions .buy-button{padding:7px 7px;font-size:.76rem}.coins{font-size:.78rem;padding:5px}#stage{inset-block-start:118px}.character{width:112px;height:112px}.physics-item.slime{width:96px;height:96px}.collector,.machine{width:76px;height:76px}.tutorial{top:124px}}

<body>
<header class="topbar"><h1 class="brand">Dom Putty Fanpage</h1><div class="top-actions"><div class="coins" id="coin-target" aria-label="Coins. Drop dollar notes here.">Coins <strong id="coins" title="Click the number three times for admin access">10</strong></div><button class="buy-button" id="buy-button" type="button">Buy Burger · 8</button><button class="buy-button" id="shop-button" type="button">Shop</button></div></header>
<main id="stage" aria-label="Play area"><img class="character" id="bennett" src="bs.png" alt="Bennett Speller. Click him to make goop." draggable="false"></main>
<div class="conversion" id="conversion" role="progressbar" aria-label="Burger to Snickers progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div><span class="progress-percent" id="progress-percent">0%</span></div><div class="shop-popover" id="slime-shop" role="dialog" aria-label="Shop"></div><div class="admin-popover" id="admin" role="dialog" aria-label="Admin menu"><h2>Admin Menu</h2><p>Give yourself 10 coins per click.</p><button class="buy-button" id="admin-coins" type="button">Give 10 Coins</button><button class="buy-button" id="admin-close" type="button">Close</button></div>

<script>
const stage=document.getElementById('stage'),bennett=document.getElementById('bennett'),buyButton=document.getElementById('buy-button'),coinsDisplay=document.getElementById('coins'),coinTarget=document.getElementById('coin-target'),conversion=document.getElementById('conversion'),progressFill=document.getElementById('progress-fill'),progressPercent=document.getElementById('progress-percent'),shop=document.getElementById('slime-shop'),admin=document.getElementById('admin'),tutorial=document.getElementById('tutorial'),tutorialTitle=document.getElementById('tutorial-title'),tutorialText=document.getElementById('tutorial-text'),tutorialStepLabel=document.getElementById('tutorial-step');
const gravity=1250,floorBounce=.62,wallBounce=.72,burgerCost=8,conversionTime=2600,bodies=[];let coins=10,converting=false,conversionQueue=0,conversionStartedAt=0,slimeBody=null,goopFed=0,tomBody=null,collectorBody=null,collectorLevel=0,superLevel=0,burgermaticLevel=0,snickermaticLevel=0,atmOwned=false,tutorialStep=0,adminClicks=0,lastAdminClick=0,burgerTimer=0;
const tutorialCopy=[['Buy a burger','Click “Buy Burger · 8” to buy a burger.'],['Feed Bennett','Drag the burger onto Bennett. He will turn it into a Snickers bar.'],['Give Tom the Snickers','Drag the Snickers bar onto Tom to get dollar notes.'],['Deposit the money','Drag a dollar note onto Bennett to add it to your balance.'],['Make goop','Click Bennett to make goop. Click him again whenever you want more.'],['Open the shop','Click Shop (or click the slime) to open the shop. This is the end of the tutorial; purchases are optional.']];
function showTutorial(){if(tutorialStep>=tutorialCopy.length){tutorial.remove();return}tutorialTitle.textContent=tutorialCopy[tutorialStep][0];tutorialText.textContent=tutorialCopy[tutorialStep][1];tutorialStepLabel.textContent=`Step ${tutorialStep+1} of ${tutorialCopy.length}`}function completeTutorialStep(step){if(tutorialStep===step){tutorialStep++;showTutorial()}}document.getElementById('skip-tutorial').addEventListener('click',()=>tutorial.remove());showTutorial();
function makeBody(element,x,y,width,height,kind){return{element,x,y,vx:0,vy:0,angle:0,spin:0,width,height,kind,held:false,pointerId:null,grabX:0,grabY:0,lastX:0,lastY:0,lastTime:0,movedDuringDrag:false,removed:false}}
const benBody=makeBody(bennett,0,0,116,116,'bennett');bodies.push(benBody);
function setPosition(b){b.element.style.left=`${b.x}px`;b.element.style.top=`${b.y}px`;b.element.style.transform=`translate(-50%,-50%) rotate(${b.angle}rad)`}function placeBennett(){benBody.x=stage.clientWidth/2;benBody.y=stage.clientHeight-benBody.height/2-12;setPosition(benBody)}
function refreshShop(){shop.innerHTML=`<h2>Shop & Upgrades</h2><p>Buy machines and upgrades as you earn coins. You can close the shop without buying anything.</p>${shopItem('collector',collectorLevel?`Collector Upgrade ${collectorLevel+1}`:'Goop Collector',10+collectorLevel*15,collectorLevel>=5?'Max level':'Faster collector; carries 10 + 2 per level')}${shopItem('super',superLevel?`Super Burger Upgrade ${superLevel+1}`:'Super Burger',35+superLevel*30,superLevel?'Produces burgers faster':'Produces one free burger every 12 seconds')}${shopItem('burgermatic',burgermaticLevel?'Burgermatic 1000 Upgrade':'Burgermatic 1000',90+burgermaticLevel*60,burgermaticLevel?'Feeds burgers faster':'Automatically feeds purchased/produced burgers to Bennett')}${shopItem('snickermatic',snickermaticLevel?'Snickermatic 1000 Upgrade':'Snickermatic 1000',140+snickermaticLevel*90,snickermaticLevel?'Handles Snickers faster':'Automatically gives Bennett’s Snickers to Tom')}${shopItem('atm',atmOwned?'ATM installed':'ATM',25,'Automatically deposits every dollar note')}`;shop.querySelectorAll('[data-buy]').forEach(button=>button.addEventListener('click',()=>buyUpgrade(button.dataset.buy)))}function shopItem(key,title,cost,description){const owned=key==='atm'&&atmOwned;return `<button class="buy-button" data-buy="${key}" ${owned||coins<cost?'disabled':''}>${owned?'Owned ✓':`${title} · ${cost} Coins`}</button><div class="shop-status">${description}</div>`}function updateCoins(){coinsDisplay.textContent=String(coins);buyButton.disabled=coins<burgerCost;buyButton.textContent=coins>=burgerCost?'Buy Burger · 8':'Need 8 Coins';refreshShop()}
function droppedOn(body,target){const a=body.element.getBoundingClientRect(),b=target.getBoundingClientRect(),x=a.left+a.width/2,y=a.top+a.height/2;return x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom}
function attachDrag(b){b.element.addEventListener('pointerdown',e=>{if(b.removed||b.kind==='collector'||b.kind==='machine')return;e.preventDefault();b.held=true;b.pointerId=e.pointerId;b.movedDuringDrag=false;const r=stage.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;b.grabX=px-b.x;b.grabY=py-b.y;b.lastX=px;b.lastY=py;b.lastTime=performance.now();b.vx=b.vy=0;b.element.classList.add('held');b.element.setPointerCapture(e.pointerId)});b.element.addEventListener('pointermove',e=>{if(!b.held||e.pointerId!==b.pointerId)return;const now=performance.now(),r=stage.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,dt=Math.max((now-b.lastTime)/1000,.008),dx=px-b.lastX,dy=py-b.lastY;if(Math.hypot(dx,dy)>4)b.movedDuringDrag=true;b.vx=dx/dt;b.vy=dy/dt;b.spin=(dx-dy)*.008;b.angle+=b.spin;b.x=px-b.grabX;b.y=py-b.grabY;b.lastX=px;b.lastY=py;b.lastTime=now;setPosition(b);updateConversionPosition()});const release=e=>{if(!b.held||e.pointerId!==b.pointerId)return;const onBen=b!==benBody&&droppedOn(b,bennett),tom=bodies.find(x=>x.kind==='tom'&&!x.removed),onTom=b.kind==='snickers'&&tom&&droppedOn(b,tom.element),onSlime=b.kind==='goop'&&slimeBody&&!slimeBody.removed&&droppedOn(b,slimeBody.element);b.held=false;b.pointerId=null;b.element.classList.remove('held');b.vx=Math.max(-1900,Math.min(1900,b.vx));b.vy=Math.max(-1900,Math.min(1900,b.vy));if(b.kind==='burger'&&onBen)eatBurger(b);else if(b.kind==='snickers'&&onTom)giveSnickersToTom(b,tom);else if(b.kind==='money'&&(onBen||droppedOn(b,coinTarget)))acceptDollar(b,onBen);else if(b.kind==='goop'&&onSlime)feedSlime(b);if(b===benBody){const moved=b.movedDuringDrag;b.movedDuringDrag=moved;setTimeout(()=>b.movedDuringDrag=false,0)}};b.element.addEventListener('pointerup',release);b.element.addEventListener('pointercancel',release)}attachDrag(benBody);
function spawn(kind,src,x,y,vx,vy,width,height,alt){const image=document.createElement('img');image.className=`physics-item ${kind}`;image.src=src;image.alt=alt;image.draggable=false;stage.append(image);const b=makeBody(image,x,y,width,height,kind);b.vx=vx;b.vy=vy;b.spin=kind==='snickers'?-.07:(Math.random()-.5)*.12;bodies.push(b);attachDrag(b);setPosition(b);return b}
function spawnTomOnce(){if(tomBody&&!tomBody.removed)return tomBody;const x=Math.max(55,Math.min(stage.clientWidth-55,benBody.x>stage.clientWidth*.58?stage.clientWidth*.25:stage.clientWidth*.75));tomBody=spawn('tom','tom.jpeg',x,stage.clientHeight-92,0,0,92,92,'Tom Pearl. Give him Snickers.');tomBody.spin=0;return tomBody}
function ensureSlime(){if(slimeBody&&!slimeBody.removed)return;const x=Math.max(60,Math.min(stage.clientWidth-60,benBody.x+(benBody.x<stage.clientWidth/2?170:-170)));slimeBody=spawn('slime','slime.png',x,Math.max(80,benBody.y-60),0,0,112,112,'Slime. The collector brings goop here. Click to open shop.');slimeBody.element.addEventListener('click',()=>{if(!slimeBody.movedDuringDrag)openShop(slimeBody)})}
function spawnGoop(){const a=Math.random()*Math.PI*2,s=250+Math.random()*260;spawn('goop','goop.png',benBody.x+Math.cos(a)*34,benBody.y+Math.sin(a)*34,Math.cos(a)*s,Math.sin(a)*s-70,30,30,'Goop. Drag onto slime or let your collector pick it up.');bennett.classList.remove('munch');void bennett.offsetWidth;bennett.classList.add('munch');setTimeout(()=>bennett.classList.remove('munch'),600);ensureSlime();completeTutorialStep(4)}bennett.addEventListener('click',()=>{if(!benBody.movedDuringDrag)spawnGoop()});
function openShop(anchor){const r=anchor?.getBoundingClientRect?.(),w=Math.min(330,innerWidth-32);shop.style.left=`${Math.max(16,Math.min(innerWidth-w-16,r?r.left+r.width/2-w/2:innerWidth-w-16))}px`;shop.style.top=`${Math.max(12,Math.min(innerHeight-260,r?r.top-230:126))}px`;shop.classList.add('open');refreshShop();completeTutorialStep(5)}document.getElementById('shop-button').addEventListener('click',()=>openShop(null));shop.addEventListener('pointerdown',e=>e.stopPropagation());addEventListener('pointerdown',e=>{if(shop.classList.contains('open')&&!shop.contains(e.target)&&e.target.id!=='shop-button'&&e.target!==slimeBody?.element)shop.classList.remove('open')});addEventListener('keydown',e=>{if(e.key==='Escape'){shop.classList.remove('open');admin.classList.remove('open')}});
function buyUpgrade(key){if(key==='collector'){const cost=10+collectorLevel*15;if(coins<cost||collectorLevel>=5)return;coins-=cost;collectorLevel++;if(!collectorBody)spawnCollector();else collectorBody.speed+=45;collectorBody.capacity=10+collectorLevel*2}else if(key==='super'){const cost=35+superLevel*30;if(coins<cost)return;coins-=cost;superLevel++}else if(key==='burgermatic'){const cost=90+burgermaticLevel*60;if(coins<cost)return;coins-=cost;burgermaticLevel++}else if(key==='snickermatic'){const cost=140+snickermaticLevel*90;if(coins<cost)return;coins-=cost;snickermaticLevel++}else if(key==='atm'){if(atmOwned||coins<25)return;coins-=25;atmOwned=true;const img=document.createElement('img');img.className='atm-decoration';img.src='atm.png';img.alt='ATM';stage.append(img)}updateCoins()}function spawnCollector(){const img=document.createElement('img');img.className='physics-item collector';img.src='colector.png';img.alt='Goop collector';stage.append(img);collectorBody=makeBody(img,Math.max(50,benBody.x-120),stage.clientHeight-59,90,90,'collector');collectorBody.load=[];collectorBody.speed=240;collectorBody.capacity=10+(collectorLevel*2);bodies.push(collectorBody);collectorBody.hitbox=document.createElement('div');collectorBody.hitbox.className='collector-hitbox';stage.append(collectorBody.hitbox);collectorBody.stackElement=document.createElement('div');collectorBody.stackElement.className='hand-stack';stage.append(collectorBody.stackElement);updateCollectorDecor()}
function updateCollectorDecor(){if(!collectorBody)return;const c=collectorBody;c.hitbox.style.left=`${c.x-34}px`;c.hitbox.style.top=`${c.y-54}px`;c.stackElement.style.left=`${c.x+10}px`;c.stackElement.style.top=`${c.y-66}px`;c.stackElement.innerHTML='';c.load.forEach((_,i)=>{const img=document.createElement('img');img.src='goop.png';img.style.left=`${i%3*10}px`;img.style.bottom=`${Math.floor(i/3)*7}px`;c.stackElement.append(img)});if(c.load.length){const count=document.createElement('span');count.className='stack-count';count.textContent=c.load.length;c.stackElement.append(count)}}
function removeBody(b){if(b.removed)return;b.removed=true;b.element.remove()}function moneyDrop(x,y,value=5){const b=spawn('money','dal.png',x,y,(Math.random()-.5)*220,-280,40,28,`${value} dollar note. Drag onto Bennett or Coins.`);b.value=value;return b}function deliverGoopToSlime(amount=1){goopFed+=amount;if(slimeBody&&!slimeBody.removed)slimeBody.element.animate([{scale:'1'},{scale:'1.1 .92'},{scale:'1'}],{duration:220});while(goopFed>=5){goopFed-=5;if(slimeBody&&!slimeBody.removed)slimeBody.element.animate([{scale:'1'},{scale:'1.18'},{scale:'1'}],{duration:330});moneyDrop(slimeBody.x,slimeBody.y-26,1)}}
function overlaps(a,b){const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();return ar.left<br.right&&ar.right>br.left&&ar.top<br.bottom&&ar.bottom>br.top}
function collectorThink(dt){if(!collectorBody)return;ensureSlime();const c=collectorBody,goops=bodies.filter(b=>b.kind==='goop'&&!b.removed&&!b.held),returning=c.load.length>=(c.capacity||10)||goops.length===0,target=returning?slimeBody:goops.reduce((best,b)=>!best||Math.hypot(b.x-c.x,b.y-c.y)<Math.hypot(best.x-c.x,best.y-c.y)?b:best,null);if(!target)return;const tx=target.kind==='slime'?slimeBody.x:target.x,ty=target.kind==='slime'?stage.clientHeight-c.height/2-12:target.y,dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy),step=Math.min(d,c.speed*dt);if(d>2){c.x+=dx/d*step;c.y+=dy/d*step}c.x=Math.max(c.width/2,Math.min(stage.clientWidth-c.width/2,c.x));c.y=Math.max(c.height/2,Math.min(stage.clientHeight-c.height/2-12,c.y));setPosition(c);updateCollectorDecor();if(!returning&&target.kind==='goop'&&overlaps(c.hitbox,target.element)){removeBody(target);c.load.push(target);updateCollectorDecor()}else if(returning&&c.load.length&&Math.hypot(slimeBody.x-c.x,ty-c.y)<82){const n=c.load.length;c.load.length=0;updateCollectorDecor();deliverGoopToSlime(n)}}
function dispenseBurger(){if(coins<burgerCost)return;coins-=burgerCost;updateCoins();spawn('burger','burger.png',stage.clientWidth/2,55,(Math.random()-.5)*55,55,54,54,'Burger. Drag onto Bennett.');completeTutorialStep(0)}buyButton.addEventListener('click',dispenseBurger);function startConversion(){if(!conversionQueue){converting=false;conversion.classList.remove('visible');return}conversionQueue--;converting=true;conversionStartedAt=performance.now();conversion.classList.add('visible');updateConversionPosition()}function eatBurger(b){if(b.removed)return;removeBody(b);conversionQueue++;if(!converting)startConversion();completeTutorialStep(1)}function updateConversionPosition(){if(!converting)return;const r=bennett.getBoundingClientRect(),w=92;conversion.style.left=`${Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))}px`;conversion.style.top=`${Math.max(8,r.top-30)}px`}function finishConversion(){converting=false;conversion.classList.remove('visible');progressFill.style.width='0%';progressPercent.textContent='0%';conversion.setAttribute('aria-valuenow','0');spawn('snickers','bar.png',benBody.x-35,benBody.y-36,-300,-420,72,42,'Snickers. Drag onto Tom.');spawnTomOnce();if(conversionQueue)startConversion()}function giveSnickersToTom(bar,tom){removeBody(bar);tom.element.animate([{scale:'1'},{scale:'1.05 .95'},{scale:'1'}],{duration:250});moneyDrop(tom.x-20,tom.y-25,5);moneyDrop(tom.x+20,tom.y-30,5);completeTutorialStep(2)}function acceptDollar(b,onBen=false){if(b.removed)return;removeBody(b);coins+=b.value||1;updateCoins();if(onBen)completeTutorialStep(3)}function feedSlime(b){removeBody(b);deliverGoopToSlime()}
function spawnMachine(kind,src,label){const img=document.createElement('img');img.className='physics-item machine';img.src=src;img.alt=label;stage.append(img);const body=makeBody(img,Math.min(stage.clientWidth-60,90+Math.random()*(stage.clientWidth-180)),stage.clientHeight-58,86,86,'machine');body.vx=0;body.vy=0;bodies.push(body);const tag=document.createElement('div');tag.className='machine-label';tag.textContent=label;stage.append(tag);body.tag=tag;return body}
function runMachines(dt){if(superLevel){burgerTimer+=dt;if(burgerTimer>=Math.max(3,12-(superLevel-1)*2)){burgerTimer=0;spawn('burger','burger.png',Math.random()*stage.clientWidth,50,(Math.random()-.5)*80,40,54,54,'Super Burger. Feed Bennett.')}}for(const b of [...bodies]){if(b.removed)continue;if(b.kind==='burger'&&burgermaticLevel&&!b.held&&Math.hypot(b.x-benBody.x,b.y-benBody.y)<150)eatBurger(b);if(b.kind==='snickers'&&snickermaticLevel&&!b.held){const tom=bodies.find(x=>x.kind==='tom'&&!x.removed);if(tom&&Math.hypot(b.x-tom.x,b.y-tom.y)<160)giveSnickersToTom(b,tom)}}}
function updateConversion(now){if(!converting)return;const p=Math.min((now-conversionStartedAt)/conversionTime,1),n=Math.floor(p*100);progressFill.style.width=`${n}%`;progressPercent.textContent=`${n}%`;conversion.setAttribute('aria-valuenow',String(n));updateConversionPosition();if(p>=1)finishConversion()}
// Three quick clicks on the coin total request the simple admin passcode.
coinsDisplay.addEventListener('click',()=>{const now=Date.now();adminClicks=now-lastAdminClick<900?adminClicks+1:1;lastAdminClick=now;if(adminClicks>=3){adminClicks=0;if(prompt('Admin passcode:')==='888')admin.classList.add('open')}});document.getElementById('admin-coins').addEventListener('click',()=>{coins+=10;updateCoins()});document.getElementById('admin-close').addEventListener('click',()=>admin.classList.remove('open'));
let previousTime=performance.now();function animate(now){const dt=Math.min((now-previousTime)/1000,.032);previousTime=now;const width=stage.clientWidth,height=stage.clientHeight,floor=height-12;for(const b of bodies){if(b.removed||b.held||b.kind==='collector'||b.kind==='machine')continue;const hw=b.width/2,hh=b.height/2;b.vy+=gravity*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.spin*dt*30;b.spin*=Math.pow(.985,dt*60);if(b.x<hw){b.x=hw;b.vx=Math.abs(b.vx)*wallBounce}else if(b.x>width-hw){b.x=width-hw;b.vx=-Math.abs(b.vx)*wallBounce}if(b.y<hh){b.y=hh;b.vy=Math.abs(b.vy)*wallBounce}else if(b.y>floor-hh){b.y=floor-hh;if(Math.abs(b.vy)>105){b.vy=-Math.abs(b.vy)*floorBounce;b.vx*=.88}else{b.vy=0;b.vx*=.94;if(Math.abs(b.vx)<14)b.vx=0}}setPosition(b)}collectorThink(dt);runMachines(dt);if(atmOwned)for(const b of bodies)if(b.kind==='money'&&!b.removed)acceptDollar(b);updateConversion(now);requestAnimationFrame(animate)}
addEventListener('resize',()=>{for(const b of bodies){b.x=Math.max(b.width/2,Math.min(stage.clientWidth-b.width/2,b.x));b.y=Math.min(stage.clientHeight-b.height/2,b.y);setPosition(b)}updateCollectorDecor();updateConversionPosition()});placeBennett();spawnTomOnce();updateCoins();requestAnimationFrame(animate);
</script></body></html>
