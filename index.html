<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101513">
  <title>Dom Putty Fanpage — Burger Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#101513;color:#f7f8f6;font-family:"DM Sans","Segoe UI",sans-serif;user-select:none}.topbar{position:fixed;z-index:5;inset:0 0 auto;height:112px;padding:18px 22px;border-bottom:1px solid #ffffff12;background:#171d1a}.brand{position:absolute;top:18px;left:22px;margin:0;font-size:clamp(1.05rem,2.8vw,1.65rem);letter-spacing:-.04em}.top-actions{position:absolute;top:18px;right:22px;display:flex;align-items:center;gap:10px}.coins{padding:7px 9px;border-radius:8px;color:#bfc8c2;font-size:.9rem}.coins strong{margin-left:5px;color:#7be397;font-size:1.12rem}.buy-button{border:1px solid #78cd8e;border-radius:9px;padding:9px 12px;background:transparent;color:#bff1cc;font:inherit;font-weight:800;cursor:pointer}.buy-button:hover:not(:disabled){background:#78cd8e18}.buy-button:disabled{cursor:not-allowed;opacity:.42}#stage{position:fixed;z-index:1;inset:112px 0 0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#26312a,#111714 68%,#0c100e)}#stage::after{position:absolute;z-index:1;right:0;bottom:0;left:0;height:15px;background:#596359;content:"";pointer-events:none}.character,.physics-item{position:absolute;z-index:2;display:block;object-fit:contain;touch-action:none;user-select:none;-webkit-user-drag:none;will-change:left,top,transform}.character{z-index:3;width:132px;height:132px;cursor:grab}.physics-item{z-index:4;cursor:grab}.character.held,.physics-item.held{cursor:grabbing}.physics-item.burger{width:56px;height:56px}.physics-item.goop{width:30px;height:30px}.physics-item.slime{width:112px;height:112px;cursor:pointer}.physics-item.tom{width:92px;height:92px}.physics-item.snickers{width:76px;height:44px}.physics-item.money{width:42px;height:30px}.collector{z-index:3;width:94px;height:94px;cursor:default}.hand-stack{position:absolute;z-index:5;pointer-events:none;width:46px;height:42px}.hand-stack img{position:absolute;width:18px;height:18px;object-fit:contain;filter:drop-shadow(0 1px 2px #0008)}.stack-count{position:absolute;right:-5px;top:-8px;min-width:18px;height:18px;padding:1px 4px;border-radius:10px;background:#7be397;color:#102017;font-size:11px;font-weight:800;text-align:center}.shop-popover{position:fixed;z-index:10;display:none;width:min(280px,calc(100vw - 32px));padding:16px;border:1px solid #ffffff40;border-radius:14px;background:#1c2420;box-shadow:0 18px 50px #0009}.shop-popover.open{display:block;animation:pop .22s cubic-bezier(.2,1.4,.45,1) both}.shop-popover h2{margin:0 0 8px;font-size:1.1rem}.shop-popover p{margin:0 0 12px;color:#bfc8c2;font-size:.9rem}.shop-popover .buy-button{width:100%}.shop-status{margin-top:9px;color:#a9d8b4;font-size:.82rem}.conversion{position:fixed;z-index:6;display:none;width:92px;height:22px;overflow:hidden;border:1px solid #ffffff55;border-radius:12px;background:#d7ddd7;pointer-events:none}.conversion.visible{display:block}.progress-fill{width:0;height:100%;border-radius:inherit;background:#78cd8e}.progress-percent{position:absolute;inset:0;display:grid;place-items:center;color:#15241a;font-size:.72rem;font-weight:800}.character.munch{animation:munch .56s ease-in-out}@keyframes pop{from{opacity:0;transform:scale(.75) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes munch{0%,100%{scale:1}22%{scale:1.1 .86}48%{scale:.92 1.1}72%{scale:1.06 .92}}@media(max-width:600px){.topbar{height:118px}.brand{top:12px;left:12px}.top-actions{top:50px;right:12px;gap:6px}.top-actions .buy-button{padding:7px 8px;font-size:.82rem}#stage{inset-block-start:118px}.character{width:112px;height:112px}.physics-item.slime{width:96px;height:96px}.collector{width:82px;height:82px}}
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Dom Putty Fanpage</h1>
    <div class="top-actions">
      <div class="coins" id="coin-target" aria-label="Coins. Drop dollar notes here.">Coins <strong id="coins">10</strong></div>
      <button class="buy-button" id="buy-button" type="button">Buy Burger · 8</button>
      <button class="buy-button" id="shop-button" type="button">Shop</button>
    </div>
  </header>
  <main id="stage" aria-label="Play area"><img class="character" id="bennett" src="bs.png" alt="Bennett Speller. Click him to make goop." draggable="false"></main>
  <div class="conversion" id="conversion" role="progressbar" aria-label="Burger to Snickers progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div><span class="progress-percent" id="progress-percent">0%</span></div>
  <div class="shop-popover" id="slime-shop" role="dialog" aria-label="Shop" aria-modal="false"></div>
  <script>
    const stage=document.getElementById('stage'),bennett=document.getElementById('bennett'),buyButton=document.getElementById('buy-button'),coinsDisplay=document.getElementById('coins'),coinTarget=document.getElementById('coin-target'),conversion=document.getElementById('conversion'),progressFill=document.getElementById('progress-fill'),progressPercent=document.getElementById('progress-percent'),shop=document.getElementById('slime-shop');
    const gravity=1250,floorBounce=.62,wallBounce=.72,burgerCost=8,collectorCost=10,conversionTime=2600,bodies=[];
    let coins=10,converting=false,conversionQueue=0,conversionStartedAt=0,slimeBody=null,goopFed=0,tomBody=null,collectorBody=null,collectorOwned=false;
    function makeBody(element,x,y,width,height,kind){return{element,x,y,vx:0,vy:0,angle:0,spin:0,width,height,kind,held:false,pointerId:null,grabX:0,grabY:0,lastX:0,lastY:0,lastTime:0,movedDuringDrag:false,removed:false}}
    const benBody=makeBody(bennett,0,0,116,116,'bennett');bodies.push(benBody);
    function setPosition(body){body.element.style.left=`${body.x}px`;body.element.style.top=`${body.y}px`;body.element.style.transform=`translate(-50%,-50%) rotate(${body.angle}rad)`}
    function placeBennett(){benBody.x=stage.clientWidth/2;benBody.y=stage.clientHeight-benBody.height/2-12;setPosition(benBody)}
    function updateCoins(){coinsDisplay.textContent=String(coins);buyButton.disabled=coins<burgerCost;buyButton.textContent=coins>=burgerCost?'Buy Burger · 8':'Need 8 Coins';refreshShop()}
    function droppedOn(body,target){const a=body.element.getBoundingClientRect(),b=target.getBoundingClientRect(),x=a.left+a.width/2,y=a.top+a.height/2;return x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom}
    function attachDrag(body){body.element.addEventListener('pointerdown',e=>{if(body.removed||body.kind==='collector')return;e.preventDefault();body.held=true;body.pointerId=e.pointerId;body.movedDuringDrag=false;const r=stage.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;body.grabX=px-body.x;body.grabY=py-body.y;body.lastX=px;body.lastY=py;body.lastTime=performance.now();body.vx=body.vy=0;body.element.classList.add('held');body.element.setPointerCapture(e.pointerId)});
      body.element.addEventListener('pointermove',e=>{if(!body.held||e.pointerId!==body.pointerId)return;const now=performance.now(),r=stage.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,dt=Math.max((now-body.lastTime)/1000,.008),dx=px-body.lastX,dy=py-body.lastY;if(Math.hypot(dx,dy)>4)body.movedDuringDrag=true;body.vx=dx/dt;body.vy=dy/dt;body.spin=(dx-dy)*.008;body.angle+=body.spin;body.x=px-body.grabX;body.y=py-body.grabY;body.lastX=px;body.lastY=py;body.lastTime=now;setPosition(body);updateConversionPosition()});
      const release=e=>{if(!body.held||e.pointerId!==body.pointerId)return;const onBen=body!==benBody&&droppedOn(body,bennett),tom=bodies.find(b=>b.kind==='tom'&&!b.removed),onTom=body.kind==='snickers'&&tom&&droppedOn(body,tom.element),onSlime=body.kind==='goop'&&slimeBody&&!slimeBody.removed&&droppedOn(body,slimeBody.element),moved=body.movedDuringDrag;body.held=false;body.pointerId=null;body.element.classList.remove('held');body.vx=Math.max(-1900,Math.min(1900,body.vx));body.vy=Math.max(-1900,Math.min(1900,body.vy));if(body.kind==='burger'&&onBen)eatBurger(body);else if(body.kind==='snickers'&&onTom)giveSnickersToTom(body,tom);else if(body.kind==='money'&&(onBen||droppedOn(body,coinTarget)))acceptDollar(body);else if(body.kind==='goop'&&onSlime)feedSlime(body);if(body===benBody){body.movedDuringDrag=moved;setTimeout(()=>body.movedDuringDrag=false,0)}};body.element.addEventListener('pointerup',release);body.element.addEventListener('pointercancel',release)}
    attachDrag(benBody);
    function spawn(kind,src,x,y,vx,vy,width,height,alt){const image=document.createElement('img');image.className=`physics-item ${kind}`;image.src=src;image.alt=alt;image.draggable=false;stage.append(image);const body=makeBody(image,x,y,width,height,kind);body.vx=vx;body.vy=vy;body.spin=kind==='snickers'?-.07:kind==='tom'?.025:(Math.random()-.5)*.12;bodies.push(body);attachDrag(body);setPosition(body);return body}
    function spawnTomOnce(){if(tomBody&&!tomBody.removed)return tomBody;const w=stage.clientWidth,x=Math.max(55,Math.min(w-55,benBody.x>w*.58?w*.25:w*.75));tomBody=spawn('tom','tom.jpeg',x,stage.clientHeight-92,0,0,92,92,'Tom Pearl. Drag Snickers onto Tom.');tomBody.spin=0;return tomBody}
    function ensureSlime(){if(slimeBody&&!slimeBody.removed)return;const sx=Math.max(60,Math.min(stage.clientWidth-60,benBody.x+(benBody.x<stage.clientWidth/2?170:-170)));slimeBody=spawn('slime','slime.png',sx,Math.max(80,benBody.y-60),0,0,112,112,'Slime. Goop collector will deliver goop here. Click to open shop.');slimeBody.element.addEventListener('click',e=>{if(!slimeBody.movedDuringDrag)openShop(slimeBody)})}
    function spawnGoop(){const a=Math.random()*Math.PI*2,s=250+Math.random()*260;spawn('goop','goop.png',benBody.x+Math.cos(a)*34,benBody.y+Math.sin(a)*34,Math.cos(a)*s,Math.sin(a)*s-70,30,30,'Goop. Drag onto slime or let your collector pick it up.');bennett.classList.remove('munch');void bennett.offsetWidth;bennett.classList.add('munch');setTimeout(()=>bennett.classList.remove('munch'),600);ensureSlime()}
    bennett.addEventListener('click',()=>{if(!benBody.movedDuringDrag)spawnGoop()});
    function openShop(anchor){const r=anchor?.getBoundingClientRect(),w=Math.min(280,innerWidth-32);shop.style.left=`${Math.max(16,Math.min(innerWidth-w-16,r?r.left+r.width/2-w/2:innerWidth-w-16))}px`;shop.style.top=`${Math.max(12,Math.min(innerHeight-190,r?r.top-180:126))}px`;shop.classList.add('open');refreshShop()}
    function refreshShop(){if(!shop)return;shop.innerHTML=`<h2>Goop Shop</h2><p>Hire a speedy collector to gather goop and feed the slime. Carries up to 10 pieces at a time.</p><button class="buy-button" id="buy-collector" type="button" ${collectorOwned||coins<collectorCost?'disabled':''}>${collectorOwned?'Collector hired ✓':coins>=collectorCost?'Buy Goop Collector · 10 Coins':'Need 10 Coins'}</button><div class="shop-status">${collectorOwned?'Your collector is gathering goop.':'Collector carries a stack of 10 in its hand.'}</div>`;document.getElementById('buy-collector').addEventListener('click',buyCollector)}
    function buyCollector(){if(collectorOwned||coins<collectorCost)return;coins-=collectorCost;collectorOwned=true;updateCoins();spawnCollector();shop.classList.remove('open')}
    document.getElementById('shop-button').addEventListener('click',()=>openShop(null));shop.addEventListener('pointerdown',e=>e.stopPropagation());addEventListener('pointerdown',e=>{if(shop.classList.contains('open')&&!shop.contains(e.target)&&e.target!==slimeBody?.element&&e.target.id!=='shop-button')shop.classList.remove('open')});addEventListener('keydown',e=>{if(e.key==='Escape')shop.classList.remove('open')});
    function spawnCollector(){const img=document.createElement('img');img.className='physics-item collector';img.src='colector.png';img.alt='Goop collector, carries up to 10 goop';img.draggable=false;stage.append(img);collectorBody=makeBody(img,Math.max(50,benBody.x-120),stage.clientHeight-60,94,94,'collector');collectorBody.load=[];collectorBody.target=null;collectorBody.speed=225;bodies.push(collectorBody);const stack=document.createElement('div');stack.className='hand-stack';stack.setAttribute('aria-hidden','true');stage.append(stack);collectorBody.stackElement=stack;updateCollectorStack()}
    function updateCollectorStack(){if(!collectorBody||!collectorBody.stackElement)return;const stack=collectorBody.stackElement;stack.innerHTML='';collectorBody.load.forEach((_,i)=>{const img=document.createElement('img');img.src='goop.png';img.style.left=`${(i%3)*10}px`;img.style.bottom=`${Math.floor(i/3)*7}px`;stack.append(img)});if(collectorBody.load.length){const count=document.createElement('span');count.className='stack-count';count.textContent=collectorBody.load.length;stack.append(count)}positionCollectorStack()}
    function positionCollectorStack(){if(!collectorBody?.stackElement)return;collectorBody.stackElement.style.left=`${collectorBody.x+18}px`;collectorBody.stackElement.style.top=`${collectorBody.y-14}px`}
    function removeBody(body){if(body.removed)return;body.removed=true;body.element.remove()}
    function collectorThink(dt){if(!collectorBody||collectorBody.removed||collectorBody.held)return;const c=collectorBody;ensureSlime();let target=null;if(c.load.length>=10)target=slimeBody;else if(c.load.length>0&&slimeBody&&!slimeBody.removed)target=slimeBody;else{const goops=bodies.filter(b=>b.kind==='goop'&&!b.removed&&!b.held);if(goops.length)target=goops.reduce((best,b)=>Math.hypot(b.x-c.x,b.y-c.y)<Math.hypot(best.x-c.x,best.y-c.y)?b:best)}
      c.target=target;if(!target){c.x=Math.max(c.width/2,Math.min(stage.clientWidth-c.width/2,c.x+Math.sin(performance.now()/900)*c.speed*dt*.2));c.y=stage.clientHeight-c.height/2-12;setPosition(c);positionCollectorStack();return}
      const tx=target.x,ty=target.kind==='slime'?stage.clientHeight-c.height/2-12:target.y,dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy),reach=target.kind==='slime'?78:30;if(d<=reach){if(target.kind==='goop'&&!target.removed&&c.load.length<10){removeBody(target);c.load.push(target);updateCollectorStack()}else if(target.kind==='slime'&&c.load.length){c.load.pop();updateCollectorStack();deliverGoopToSlime()}return}
      const step=Math.min(d,c.speed*dt);c.x+=dx/d*step;c.y+=dy/d*step;c.x=Math.max(c.width/2,Math.min(stage.clientWidth-c.width/2,c.x));c.y=Math.max(c.height/2,Math.min(stage.clientHeight-c.height/2-12,c.y));setPosition(c);positionCollectorStack()}
    function deliverGoopToSlime(){goopFed++;if(slimeBody&&!slimeBody.removed)slimeBody.element.animate([{scale:'1'},{scale:'1.1 .92'},{scale:'1'}],{duration:220});if(goopFed>=5){goopFed-=5;if(slimeBody&&!slimeBody.removed)slimeBody.element.animate([{scale:'1'},{scale:'1.18'},{scale:'1'}],{duration:330});fireSlimeDollar()}}
    function dispenseBurger(){if(coins<burgerCost)return;coins-=burgerCost;updateCoins();const tube=document.querySelector('.tube')?.getBoundingClientRect(),r=stage.getBoundingClientRect();if(tube)spawn('burger','burger.png',tube.left+tube.width/2-r.left,Math.max(34,tube.bottom-r.top+26),(Math.random()-.5)*55,55,54,54,'Burger. Drag onto Bennett.');else spawn('burger','burger.png',stage.clientWidth/2,50,0,55,54,54,'Burger. Drag onto Bennett.')}
    document.getElementById('buy-button').addEventListener('click',dispenseBurger);
    function startConversion(){if(!conversionQueue){converting=false;conversion.classList.remove('visible');return}conversionQueue--;converting=true;conversionStartedAt=performance.now();conversion.classList.add('visible');updateConversionPosition()}
    function eatBurger(body){if(body.removed)return;removeBody(body);bennett.classList.add('munch');setTimeout(()=>bennett.classList.remove('munch'),600);conversionQueue++;if(!converting)startConversion()}
    function updateConversionPosition(){if(!converting)return;const r=bennett.getBoundingClientRect(),w=conversion.offsetWidth||92;conversion.style.left=`${Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))}px`;conversion.style.top=`${Math.max(8,r.top-conversion.offsetHeight-8)}px`}
    function finishConversion(){converting=false;conversion.classList.remove('visible');progressFill.style.width='0%';progressPercent.textContent='0%';conversion.setAttribute('aria-valuenow','0');spawn('snickers','bar.png',Math.max(45,benBody.x-35),Math.max(55,benBody.y-36),-300,-420,72,42,'Snickers. Drag onto Tom.');spawnTomOnce();if(conversionQueue)startConversion()}
    function giveSnickersToTom(bar,tom){removeBody(bar);tom.element.animate([{scale:'1'},{scale:'1.05 .95'},{scale:'1'}],{duration:250});spawn('money','dal.png',tom.x-20,tom.y-25,-110,-260,40,28,'Dollar note. Drag to coins.');spawn('money','dal.png',tom.x+20,tom.y-30,110,-290,40,28,'Dollar note. Drag to coins.')}
    function acceptDollar(body){removeBody(body);coins++;updateCoins()}
    function fireSlimeDollar(){if(!slimeBody||slimeBody.removed)return;const dir=Math.random()<.5?-1:1;spawn('money','dal.png',slimeBody.x,slimeBody.y-26,dir*(120+Math.random()*130),-300-Math.random()*100,40,28,'Dollar note. Drag onto coins.')}
    function feedSlime(body){removeBody(body);deliverGoopToSlime()}
    function updateConversion(now){if(!converting)return;const p=Math.min((now-conversionStartedAt)/conversionTime,1),n=Math.floor(p*100);progressFill.style.width=`${n}%`;progressPercent.textContent=`${n}%`;conversion.setAttribute('aria-valuenow',String(n));updateConversionPosition();if(p>=1)finishConversion()}
    let previousTime=performance.now();function animate(now){const dt=Math.min((now-previousTime)/1000,.032);previousTime=now;const width=stage.clientWidth,height=stage.clientHeight,floor=height-12;for(const b of bodies){if(b.removed||b.held||b.kind==='collector')continue;const hw=b.width/2,hh=b.height/2;b.vy+=gravity*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.spin*dt*30;b.spin*=Math.pow(.985,dt*60);if(b.x<hw){b.x=hw;b.vx=Math.abs(b.vx)*wallBounce}else if(b.x>width-hw){b.x=width-hw;b.vx=-Math.abs(b.vx)*wallBounce}if(b.y<hh){b.y=hh;b.vy=Math.abs(b.vy)*wallBounce}else if(b.y>floor-hh){b.y=floor-hh;if(Math.abs(b.vy)>105){b.vy=-Math.abs(b.vy)*floorBounce;b.vx*=.88}else{b.vy=0;b.vx*=b.kind==='bennett'?.9:.94;if(Math.abs(b.vx)<14)b.vx=0}}setPosition(b)}collectorThink(dt);updateConversion(now);requestAnimationFrame(animate)}
    addEventListener('resize',()=>{for(const b of bodies){b.x=Math.max(b.width/2,Math.min(stage.clientWidth-b.width/2,b.x));b.y=Math.min(stage.clientHeight-b.height/2,b.y);setPosition(b)}positionCollectorStack();updateConversionPosition()});
    placeBennett();spawnTomOnce();updateCoins();requestAnimationFrame(animate);
  </script>
</body>
</html>
